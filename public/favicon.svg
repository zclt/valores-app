<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="face" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- face -->
  <circle cx="32" cy="32" r="30" fill="url(#face)"/>

  <!-- left eye -->
  <circle cx="20" cy="26" r="9" fill="#1a1a2e"/>
  <text x="20" y="31" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="11" fill="#4ade80">$</text>

  <!-- right eye -->
  <circle cx="44" cy="26" r="9" fill="#1a1a2e"/>
  <text x="44" y="31" text-anchor="middle"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900" font-size="11" fill="#4ade80">$</text>

  <!-- smile -->
  <path d="M19 43 Q32 55 45 43" stroke="#92400e" stroke-width="2.5"
        stroke-linecap="round" fill="none"/>

  <!-- blush -->
  <ellipse cx="11" cy="40" rx="6" ry="4" fill="#f87171" opacity="0.45"/>
  <ellipse cx="53" cy="40" rx="6" ry="4" fill="#f87171" opacity="0.45"/>
</svg>
